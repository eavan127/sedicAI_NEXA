
signal:
  fs: 3200000
  window_len: 2048
  total_duration: 0.002
snr_bins_db: [-10, -6, -2, 2, 6, 10]
classes: [BPSK, QPSK, 16QAM, 64QAM, LFM_RADAR, FHSS, JAMMING]
judged_classes: [LFM_RADAR, FHSS, JAMMING]
dataset:
  examples_per_class_per_snr: 250
  val_frac: 0.15
  test_frac: 0.15
  seed: 42
radar:
  pulse_width_s: [0.00001, 0.0001]
  bandwidth_hz: [50000, 1500000]
  pri_s: [0.001, 0.01]
fhss:
  hop_rate_hz: [6250, 150000]
  n_channels: [8, 64]
  channel_spacing_hz: [10000, 40000]
jamming:
  jsr_db: [0, 20]
  max_tones: 3
  sweep_bandwidth_hz: [100000, 500000]
training:
  epochs: 25
  batch_size: 64
  learning_rate: 0.001
  scheduler_patience: 3
paths:
  raw_data: data/raw
  processed_data: data/processed
  checkpoints: results
  evals: evals

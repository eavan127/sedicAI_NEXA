# Tiny config for verifying the pipeline runs end-to-end in seconds.
# Same shape as default.yaml, just far fewer examples and epochs.
# Results are meaningless — this only proves the wiring works.
#
#   SEDIC_CONFIG=configs/smoke.yaml python -m src.data.build_dataset
#   SEDIC_CONFIG=configs/smoke.yaml python -m src.train

signal:
  # Mirrors default.yaml so the smoke run exercises the real shapes.
  fs: 3200000
  window_len: 512
  total_duration: 0.002

snr_bins_db: [0, 10]

classes:
  - BPSK
  - QPSK
  - 16QAM
  - 64QAM
  - LFM_RADAR
  - FHSS
  - JAMMING
  - NOISE_FLOOR

judged_classes: [LFM_RADAR, FHSS, JAMMING]

dataset:
  examples_per_class_per_snr: 30
  val_frac: 0.2
  test_frac: 0.2
  seed: 42
  # Fraction of LFM_RADAR examples taken from RadChar (real) rather than our
  # generator. The remainder is synthetic, so the class total still matches the
  # other classes instead of doubling. 0 = fully synthetic.
  radchar_fraction: 0.5

radar:
  pulse_width_s: [0.00001, 0.0001]
  bandwidth_hz: [50000, 1500000]
  pri_s: [0.000017, 0.01]
  time_delay_s: [0.000001, 0.00001]
  max_duty_cycle: 0.15
  # RadChar fires a burst of 2-6 pulses then falls silent for the rest of the
  # frame; a continuously-scanning radar keeps transmitting. Both are real, so
  # burst_fraction of examples use a capped burst and the rest run continuous.
  n_pulses: [2, 7]                     # upper bound exclusive -> 2..6
  burst_fraction: 0.5

fhss:
  hop_rate_hz: [25000, 150000]
  n_channels: [8, 64]
  channel_spacing_hz: [10000, 40000]

jamming:
  jsr_db: [0, 20]
  max_tones: 1
  sweep_bandwidth_hz: [100000, 500000]
  # Barrage floods a TARGETED band, not the whole spectrum. Pure white noise
  # was indistinguishable from low-duty radar buried in AWGN (barrage 75.0%,
  # with 35/200 predicted as LFM_RADAR). A band-limited jammer has a defined
  # spectral shape; white noise has none.
  barrage_bandwidth_hz: [200000, 1200000]

training:
  epochs: 2
  batch_size: 16
  learning_rate: 0.001
  scheduler_patience: 3

paths:
  raw_data: data/raw
  processed_data: data/processed
  checkpoints: results
  evals: evals

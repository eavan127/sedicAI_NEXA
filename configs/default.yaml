# Central config for the SEDIC 2026 Track 1 pipeline.
# Every tunable number lives here, not scattered across scripts — so the
# technical brief can cite exactly what was used, and so re-running an
# experiment only means editing one file.
#
# NOTE: written as plain decimals, not 1.0e6 — YAML 1.1 parses an unsigned
# exponent as a string, which fails silently until it hits numpy.

signal:
  # Anchored to RadChar, the only source with BOTH a fixed length and a fixed
  # absolute sample rate. Everything else is flexible, so everything else
  # conforms to it. Padding RadChar up to a longer window would leave half of
  # every radar example flat, and the model would learn "flat tail => radar".
  #
  # fs must also exceed twice the highest instantaneous frequency any generator
  # produces, or signals alias and fold back as the wrong frequency. See
  # tests/test_config.py — the Nyquist checks there are load-bearing.
  fs: 3200000 # RadChar native -> Nyquist +/-1.6 MHz
  window_len: 512 # RadChar native -> 160 us of signal per window
  total_duration: 0.002 # seconds per generated example

# SNR sweep applied to every class, so the accuracy-vs-SNR curve covers
# the "clean to faded/noisy" range the rules require.
#
# MUST be even numbers. RadioML 2018.01A samples SNR from -20 to +30 dB in 2 dB
# steps, so odd values return zero civilian examples — leaving those bins with
# only radar/FHSS/jamming, which lets the model learn "odd SNR => threat class"
# instead of learning the signals. Our own generators accept any value, so
# RadioML is the binding constraint.
snr_bins_db: [-10, -6, -2, 2, 6, 10]

classes:
  - BPSK
  - QPSK
  - 16QAM
  - 64QAM
  - LFM_RADAR
  - FHSS
  - JAMMING
  # Empty channel -- nobody transmitting. Not a signal type, but softmax must
  # output SOMETHING, and without this option a blank window is forced into the
  # class it least-poorly resembles: barrage jamming, which is also noise-like.
  # That reports a hostile emitter on empty spectrum -- the costliest false
  # alarm available. Not judged; exists to protect the judged classes.
  - NOISE_FLOOR

# Which classes the benchmark is judged on.
judged_classes: [LFM_RADAR, FHSS, JAMMING]

# Organiser's minimum recall/accuracy to pass, on the classes above.
# Confirmed 80% (2026-08-14), down from the original 90% announcement.
# Kept here, not hardcoded in evaluate.py, so the next threshold change is a
# one-line edit instead of a source hunt.
benchmark_recall: 0.80

# Sigmoid decision threshold for the multi-label head: a class counts as
# "present" in a window when sigmoid(logit) > this value. Classes are judged
# independently, so more than one can be flagged in the same window (e.g.
# BPSK AND JAMMING together).
#
# ONE global threshold could not serve all three judged classes at once:
# sweeping it from 0.5 down to 0.15 on the eileen-multilabel-complete run
# (2026-08-23) gave:
#     threshold   LFM_RADAR   FHSS    JAMMING   (recall)
#     0.5          52.0%      59.7%    87.2%
#     0.3          59.5%      71.3%    89.6%
#     0.2          68.5%      79.5%    91.4%
#     0.15         75.9%      84.0%    92.2%
# FHSS and JAMMING passed the 80% gate well before LFM_RADAR did, so
# continuing to drag the shared threshold down to rescue LFM_RADAR was
# needlessly costing FHSS/JAMMING precision they did not need to give up
# (JAMMING precision alone fell 98%->94% for a class that passed at 0.5).
#
# Per-class thresholds instead: push LFM_RADAR further down specifically,
# and let FHSS/JAMMING recover toward higher, more precision-safe values
# now that they have passing margin to spare. Starting points below are
# extrapolated from the sweep above -- re-verify empirically (rerun
# evaluate.py) before trusting them, especially LFM_RADAR's, and retune if
# a fresh training run changes the model's probability calibration.
multilabel_threshold: 0.5 # fallback for any class not listed below
# History: originally picked by sweeping against TEST recall directly
# (0.10/0.18/0.35) -- leakage, tunes a hyperparameter against the number
# being reported. Replaced with scripts/calibrate_thresholds.py against VAL
# instead. First VAL-only pass (0.28/0.29/0.89, single-model checkpoint) hit
# two more problems, both now fixed and worth remembering:
#   1. Calibrated against a single model, then applied to the 5-model
#      ENSEMBLE -- averaging sigmoid outputs compresses extreme
#      probabilities toward the mean, so a single-model threshold is too
#      strict for the ensemble (JAMMING's recall dropped to 0.8049 purely
#      from this). Fixed: --ensemble flag averages over ensemble_*.pt
#      before sweeping, matching what's actually submitted.
#   2. Picked the highest threshold that landed EXACTLY on the 80% floor on
#      val, with zero margin -- LFM_RADAR passed val at 80.1% then scored
#      79.61% on test, a FAIL from ordinary val/test sampling noise, not a
#      real miscalibration. Fixed: --margin (default 3pts) targets 83% on
#      val instead of exactly 80%, buying headroom against that noise.
#
# Values below are scripts/calibrate_thresholds.py --ensemble --n-models 5
# (default 3pt margin), confirmed via train_ensemble.py --models 5
# --eval-only against the SAME 5 checkpoints (no retrain, isolates the
# threshold's effect): LFM_RADAR ensemble recall 0.8225 (was 0.7961 FAIL at
# the no-margin threshold), FHSS 0.8301, JAMMING 0.8451 -- OVERALL PASS,
# every judged class with real margin above 80%, not sitting on the edge.
# Re-run calibrate_thresholds.py --ensemble after any retrain -- these are
# tied to this specific set of 5 checkpoints' calibration.
multilabel_thresholds_per_class:
  LFM_RADAR: 0.26
  FHSS: 0.27
  JAMMING: 0.77
  # Civilian classes were never calibrated -- they sat on the 0.5 fallback
  # while the judged three were tuned, which is why 16QAM read 1.3% recall
  # and looked like a model that had learned nothing about it. It had: 96% of
  # true 16QAM windows score above the median negative. The probabilities are
  # informative, they simply live below 0.5.
  #
  # Selected by best F1 on the VALIDATION split, reported on test, so there is
  # no selection leakage. Recall at these values (test split, 5-model
  # ensemble): BPSK 57.6%, QPSK 47.4%, 16QAM 73.0%, 64QAM 64.0% -- against
  # 51.8 / 25.3 / 1.3 / 13.0 at 0.5.
  #
  # The cost is precision: 16QAM 37%, 64QAM 35%, QPSK 47%, BPSK 86%. These
  # classes are NOT judged, and the criterion that does depend on them --
  # comms-vs-hostile discrimination -- is about not calling civilian traffic
  # JAMMING, which these thresholds do not affect. Re-check that false-alarm
  # rate after any change here.
  BPSK: 0.33
  QPSK: 0.265
  16QAM: 0.265
  64QAM: 0.275
  # NOISE_FLOOR was the last class still on the 0.5 fallback. It is perfectly
  # separable -- the median NEGATIVE scores 0.000 -- but positives sit at a
  # median of 0.433, i.e. just under the default, which is why it read 33.6%
  # recall. At 0.265 (best F1 on validation) recall is 83.0%.
  #
  # Treated more cautiously than the civilian classes, because the error is
  # not symmetric: a false NOISE_FLOOR means calling an OCCUPIED window empty,
  # which is a missed emitter. Precision here is 57.3%, so that risk is real
  # and was checked rather than assumed -- across Radar only / FHSS only /
  # All three at -6 and +2 dB, no expected emitter was missed in either
  # smoothed or raw mode.
  #
  # The RF Replay NOISE_FLOOR gate is a SEPARATE value (session.noise_gate,
  # 0.5) and is deliberately not lowered with this one. The gate suppresses
  # other detections, so it must stay conservative; this threshold only
  # decides whether a window is REPORTED as empty.
  NOISE_FLOOR: 0.265

# Decision boundary for src/measure.py's constellation_order -- a MEASURED
# (not model) resolver for 16QAM vs 64QAM, the one distinction the trained
# classifier gets no better than a coin flip on (see that function's own
# docstring for the numbers). It thresholds the pooled, normalised
# fourth-order cumulant |C42| of recovered symbols: at or above this value
# reads 16QAM, below reads 64QAM.
#
# CALIBRATED on the VALIDATION split at SNR >= +2 dB, exactly like every
# other threshold in this file (multilabel_thresholds_per_class above) --
# NOT the midpoint of the theoretical noiseless constants (16QAM 0.680,
# 64QAM 0.619, computed directly from the ideal unit-power constellations;
# see C42_THEORY in src/measure.py). That theory-midpoint boundary (0.6495)
# was tried first and is wrong for this estimator: channel noise pulls
# |C42| toward the Gaussian limit of zero, so real recovered symbols sit
# BELOW their noiseless value, and at SNR >= +2 dB BOTH classes measure
# under 0.6495 -- a theory-derived boundary would call everything 64QAM.
#
# Validation means (450 windows/class): 16QAM 0.6223, 64QAM 0.5660 ->
# boundary (their midpoint) 0.5942. Confirmed on TEST -- no leakage, the
# boundary was picked on val and only ever scored here on test: means
# 16QAM 0.6166, 64QAM 0.5686; pooled-window accuracy .593 / .754 / .843 /
# .921 / .980 at 1 / 8 / 16 / 32 / 64 windows. This matches (does not even
# need to beat) the accuracy an earlier TEST-fitted midpoint gave (.914 @
# 32 windows) -- calibrating on val instead of test cost nothing here.
#
# Do NOT "fix" this back toward 0.6495 or either raw theory constant --
# that reasoning is exactly what produced the wrong first version of this
# value, which classified real 64QAM as 16QAM at every realistic SNR.
constellation_order:
  c42_boundary: 0.5942

# Per-class multiplier on compute_class_weights' inverse-frequency pos_weight
# (src/train.py), applied in BCEWithLogitsLoss. >1 boosts a class (missing it
# is penalised harder, pushing the model toward more confident positives);
# <1 dampens it (NOISE_FLOOR's original use, see compute_class_weights'
# docstring).
#
# Root-cause complement to the threshold table above, not a replacement: at
# the default 0.5 threshold, LFM_RADAR (52.0%), FHSS (59.7%) and JAMMING
# (87.2%) got the IDENTICAL pos_weight of ~0.72 from compute_class_weights,
# because all three have equal positive-bit counts (20,400) in the dataset.
# Equal weighting produced wildly different natural recall, so the gap is not
# a class-frequency imbalance the inverse-frequency formula already accounts
# for -- it's LFM_RADAR/FHSS being genuinely harder for the model to learn
# (most likely feature overlap between the two in the military x military
# composite examples), and the loss needs to be told that explicitly.
#
# Confirmed working 2026-08-23: after retraining with this, LFM_RADAR's
# calibrated threshold came back up from 0.10 to 0.19 while recall improved
# (83.86% -> 89.58%, see multilabel_thresholds_per_class above) -- from a
# single run, not yet re-verified with measure_variance.py against seed
# noise (2.2-8.9 points measured on these classes previously). Re-tune these
# multipliers if a future retrain's numbers don't hold up under that check:
class_weight_multipliers:
  NOISE_FLOOR: 0.5 # unchanged from the original dampen (see compute_class_weights)
  LFM_RADAR: 1.6 # furthest from calibrated (52.0% @ 0.5) -- largest boost
  FHSS: 1.3 # less severe (59.7% @ 0.5) -- smaller boost

dataset:
  # 400 -> 1000 helped substantially: all three judged classes moved at once,
  # more than any generator tweak, because the model was overfitting badly at
  # 400 (train_loss 0.068 vs val_loss 0.317).
  #
  # 1000 -> 2000 did NOT. Measured across both scripts:
  #     ensemble jamming     0.9189 -> 0.8944   (went down)
  #     single-model mean    0.8978 -> 0.9002   (up 0.2 points)
  # Both movements sit well inside a 6.2-point noise floor, so doubling the data
  # bought nothing measurable while doubling training time and pushing the
  # upload from 74 MB to 147 MB. Reverted.
  examples_per_class_per_snr: 1000
  # STANDALONE civilian (BPSK/QPSK/16QAM/64QAM) examples specifically --
  # overrides examples_per_class_per_snr for load_radioml_civilian() only,
  # leaving every synthetic class (LFM_RADAR/FHSS/JAMMING/NOISE_FLOOR) and
  # the overlay/mixture counts untouched.
  #
  # Untested lever, not a confirmed fix: civilian recall is weak (BPSK 52%,
  # QPSK 25%, 64QAM 13%, 16QAM 1% on the 2026-08-24 ensemble) despite
  # already getting a HIGHER automatic loss weight than the judged classes
  # did pre-boost (inverse-frequency gives less-common classes more weight,
  # and civilian classes are less common: ~13,200 total presence count vs
  # 20,400 for LFM_RADAR/FHSS/JAMMING). More weight didn't fix it, so the
  # leading theory is QAM constellation density under noise, not data
  # volume -- but that's inference, not something diagnosed the way the
  # FHSS hop-rate confusion was. This is real RadioML data (not synthetic),
  # so trying it is cheap relative to e.g. the FHSS fix: no new generator
  # code, no new metadata pipeline, just pulling more of what's already
  # there. RadioML has up to 4096 examples per (class, SNR) bin -- 3000
  # leaves margin below that ceiling. Re-run build_dataset.py and retrain
  # to test; if civilian recall doesn't move meaningfully, that confirms
  # (not just suggests) data volume isn't the bottleneck.
  civilian_examples_per_snr: 3000
  val_frac: 0.15
  test_frac: 0.15
  seed: 42
  # Fraction of LFM_RADAR examples taken from RadChar (real) rather than our
  # generator. The remainder is synthetic, so the class total still matches the
  # other classes instead of doubling. 0 = fully synthetic.
  #
  # NOTE: RadChar-Tiny holds only ~245 LFM waveforms per SNR bin, so at 1000
  # examples/bin a 0.5 fraction asks for 500 and receives ~245 -- the
  # real/synthetic mix lands nearer 24/76 than 50/50 on Tiny alone.
  #
  # Bumped 0.5 -> 1.0 now that RadChar-Small is available (~2,439 LFM
  # waveforms/SNR bin, comfortably above the 1000 requested): standalone
  # LFM_RADAR is fully real rather than half-synthetic. This does NOT reach
  # composite/mixture LFM_RADAR windows -- overlay_jamming() and
  # mix_components() still draw from the synthetic generator directly, so the
  # real fraction of ALL LFM_RADAR-positive windows tops out at
  # standalone_count / total_count (~29%), not 100%. Extending those two
  # functions to optionally draw a real waveform is the next step if more is
  # needed later.
  radchar_fraction: 1.0
  # Composite ("jammer overlaid on a real signal") examples, ADDITIVE on top
  # of the standalone per-class counts above -- standalone data is untouched.
  # Expressed as a fraction of examples_per_class_per_snr, generated per
  # (victim class, SNR bin) for the 6 non-NOISE_FLOOR, non-JAMMING classes.
  # Real jamming targets something (see docs/pipeline/04-jamming-generation.md),
  # so this teaches the model that shape instead of only sterile,
  # jamming-in-isolation examples.
  overlay_fraction: 0.3

  # Multi-emitter MIXTURES, additive again -- generated per (combo, SNR bin) as
  # a fraction of examples_per_class_per_snr, same convention as
  # overlay_fraction above. overlay_fraction covers "victim + JAMMING"; these
  # cover the combinations that are not about jamming at all: two legitimate
  # emitters sharing a window, which is the ordinary state of a contested band.
  mixture_fraction: 0.3
  # Power offset of each extra component relative to the first, in dB, drawn
  # per example. Widening it teaches the model to still find the weaker
  # emitter; narrowing it makes every mixture an equal-power blend, which is
  # not what a receiver sees.
  mixture_sir_db: [-6, 6]
  # RadioML windows used INSIDE a mixture are taken from its high-SNR bins and
  # treated as clean, so the composite gets exactly one add_awgn pass and the
  # SNR label describes the whole window. Standalone civilian examples and the
  # jamming overlays are untouched by this -- they keep RadioML's own labelled
  # noise, exactly as before.
  radioml_clean_min_snr_db: 24
  mixture_combos:
    # --- military x military ---
    - [LFM_RADAR, FHSS]
    # --- military x civilian ---
    - [BPSK, LFM_RADAR]
    - [QPSK, LFM_RADAR]
    - [16QAM, LFM_RADAR]
    - [64QAM, LFM_RADAR]
    - [BPSK, FHSS]
    - [QPSK, FHSS]
    - [16QAM, FHSS]
    - [64QAM, FHSS]
    # --- three-way: contested band. Kept to three combos; over-representing
    #     the hardest case skews the per-class positive rates.
    - [BPSK, LFM_RADAR, JAMMING]
    - [QPSK, FHSS, JAMMING]
    - [16QAM, LFM_RADAR, FHSS]

# Literature-informed ranges — see docs appendix. Randomized per example so
# the model learns the general signal concept, not one fixed signature.
radar:
  # Ranges deliberately SPAN two regimes, because we do not know which the
  # organisers' Qualifier stream uses:
  #
  #   RadChar (measured):  pulse 10-16 us,  PRI 17-23 us   -> duty 44-94%
  #   Physically typical:  pulse 10-100 us, PRI 1-10 ms    -> duty 0.1-10%
  #
  # RadChar's high duty cycle is a dataset-design choice (it packs 2-6 pulses
  # into a 512-sample frame), not how real radar behaves. Covering both means
  # whatever they used is more likely inside our training distribution.
  #
  # Pulse width must stay below the window duration (160 us) so each window can
  # show pulse-then-silence. That listening gap is what separates radar from a
  # sweep jammer, which runs continuously.
  pulse_width_s: [0.00001, 0.0001] # 10-100 us
  bandwidth_hz: [50000, 1500000] # Nyquist allows up to 1.5 MHz
  pri_s: [0.000017, 0.01] # 17 us - 10 ms: RadChar through realistic
  time_delay_s:
    [0.000001, 0.00001] # 1-10 us, matching RadChar — pulses must
    # not always start at sample 0
  # PRI is drawn conditional on pulse width so that pulse_width < PRI always.
  # A duty cycle above 100% would mean the next pulse starting before the
  # previous one ended — physically impossible, and it produced overlapping
  # garbage when the PRI floor was first widened to match RadChar.
  # MEASURED, not guessed. Sweeping duty cycle against the trained model:
  #     2%  87.3%   5%  86.0%   10%  86.0%
  #    25%  74.0%  50%  49.3%   90%  16.7%   <- and 116/150 called FHSS
  #
  # A near-continuous chirp train is one frequency sweep after another, which is
  # genuinely the same shape as frequency hopping. Above ~15% duty the two
  # classes stop being separable, so generating there teaches the model that one
  # shape is sometimes radar and sometimes FHSS — blurring both boundaries.
  #
  # 15% also sits inside the physically realistic band (real radar runs 0.1-10%),
  # and RadChar still supplies REAL examples across its own 44-94% duty range,
  # so the high-duty regime is covered by data that is not ambiguous.
  max_duty_cycle: 0.15
  # RadChar fires a burst of 2-6 pulses then falls silent for the rest of the
  # frame; a continuously-scanning radar keeps transmitting. Both are real, so
  # burst_fraction of examples use a capped burst and the rest run continuous.
  n_pulses: [2, 7] # upper bound exclusive -> 2..6
  burst_fraction: 0.5 # half burst, half continuous

fhss:
  # CRITICAL: the dwell time (1 / hop_rate) must be much SHORTER than the
  # window, or a window captures a single hop and the class is just a constant
  # tone — indistinguishable from tone jamming, and teaching the model nothing
  # about hopping. The old range of 100-1000 Hz gave dwell times of 1-10 ms
  # against a 512 us window: every FHSS example was one frequency.
  #
  # At a 160 us window, 25-150 kHz gives 4-24 hops per window. This models
  # FAST frequency hopping, which is the regime observable at this window
  # length. State that scoping decision in the technical brief.
  hop_rate_hz: [25000, 150000]
  n_channels: [8, 64]
  # Channel comb spans +/-(n_channels * spacing / 2), capped to keep the
  # outermost hops inside Nyquist: 64 * 48000 / 2 = 1.536 MHz < 1.6 MHz.
  # Widened from 40 kHz -> 48 kHz to use more of the available Nyquist
  # margin (was only spending 1.28 of 1.6 MHz); see tests/test_config.py::
  # test_fhss_channel_comb_respects_nyquist for the enforced ceiling.
  channel_spacing_hz: [10000, 48000]

jamming:
  jsr_db: [0, 20]
  # Reduced from 3 to 1. Probing the trained model by sub-type gave:
  #     barrage 79.5%   tone 56.5%   sweep 96.5%
  # and 85 of 200 tone examples were predicted as FHSS.
  #
  # Up to three simultaneous carriers produces a multi-peaked spectrum across
  # the window, which is also what FHSS produces as it visits several channels.
  # A single carrier is unmistakably not frequency-hopping.
  #
  # Corroborated by the seed-variance run: jamming recall spread 10.8 points
  # across five identical runs (0.728-0.836) while FHSS spread only 1.1. That
  # instability is what an undefined class boundary looks like. Watch for the
  # SPREAD collapsing as well as the mean rising — the spread is the stronger
  # signal, since the mean gap is smaller than the old noise floor.
  max_tones: 1
  sweep_bandwidth_hz: [100000, 500000]
  # Barrage floods a TARGETED band, not the whole spectrum. Pure white noise
  # was indistinguishable from low-duty radar buried in AWGN (barrage 75.0%,
  # with 35/200 predicted as LFM_RADAR). A band-limited jammer has a defined
  # spectral shape; white noise has none.
  barrage_bandwidth_hz: [200000, 1200000]

model:
  # EXPERIMENTAL, off by default. STFTBranch (src/models/amc_cnn.py) ends
  # with `f.mean(dim=2)`, which averages the frequency axis away -- "peak at
  # bin 2 then bin 6" (FHSS hopping) and "peak at bin 4 then bin 4" (tone
  # jamming) become identical features. Measured consequences: FHSS recall
  # 0.960 -> 0.040 as jammer-to-signal ratio goes 0dB -> +10dB, 46.5% of
  # held-out jamming predicted as FHSS, jamming's seed spread 10.8 points
  # against FHSS's 1.1.
  #
  # When true: STFTBranch pools time only (frequency resolution stays at
  # 200 kHz/bin instead of being halved to 400 kHz by the old 2x2 pool -- an
  # FHSS hop between adjacent channels is 10-48 kHz, a twentieth of a bin,
  # so frequency pooling was throwing away resolution this branch cannot
  # spare) and adds three explicit per-frame features computed from the STFT
  # magnitude directly (frequency max, spectral flatness, peak-frequency
  # delta) rather than only the pooled conv features.
  #
  # Default false because the five checkpoints in results/ were trained
  # against the flag-off architecture and must keep loading; this is an
  # experimental option to be evaluated (retrain + measure_variance.py)
  # before ever being turned on for a submission.
  stft_freq_summary: false

  # EXPERIMENTAL, off by default. The classifier cannot tell 16QAM from
  # 64QAM at all -- measured on the held-out test split with the 5-model
  # ensemble: picking the larger of the two probabilities is right 51.4% of
  # the time (chance), averaging 64 windows is 49.7% (still chance, because
  # the error is a systematic BIAS, not noise -- pooling the model's own
  # output cannot fix a bias), and on true 16QAM specifically it is right
  # 47.0% of the time, WORSE than chance. On 16qam.f32 in the verification
  # pack, 16QAM fires on 73% of windows and 64QAM on 68% of the SAME
  # windows.
  #
  # The information is present in the samples -- the fourth-order cumulant
  # separates the two classes even though the CNN's learned features do
  # not (measured AUC between the classes at SNR >= +2 dB, 400 windows/
  # class: 0.576 on the raw window, 0.609 after matched filtering, 0.633
  # after full symbol recovery -- see src/measure.py's constellation_order,
  # which already uses the fully-recovered-symbol version of this as a
  # MEASURED, non-model decision rule). Matched filtering alone recovers
  # most of that separation and is a fixed convolution, so it can live
  # inside the model as an expert feature -- combining deep-learned and
  # hand-built features for classes of the same family a CNN conflates is
  # the standard AMC-literature answer to exactly this failure mode.
  #
  # When true: AMC_CNN's CumulantFeatures branch (src/models/amc_cnn.py)
  # applies the RRC matched filter (src/dsp.py's rrc_taps, the SAME taps
  # recover_symbols uses -- fixed, non-learned, requires_grad=False) to the
  # raw IQ window as a depthwise Conv1d, computes three normalised cumulant
  # magnitudes on the filtered complex signal (|C40|, |C42|, |C63| --
  # src/cumulants.py, the same normalisation src/measure.py's
  # constellation_order already relies on), and concatenates them onto the
  # fused feature vector before fc1 -- fc1.in_features grows by exactly 3.
  #
  # Default false because the five checkpoints in results/ were trained
  # against the flag-off architecture (fc1 sized without these 3 extra
  # inputs) and must keep loading with strict=True; this is an
  # experimental option to be evaluated (retrain + measure_variance.py)
  # before ever being turned on for a submission.
  cumulant_features: false

  # EXPERIMENTAL, off by default. Half of LFM_RADAR's false positives are
  # genuinely FHSS (50.7%) and 35.5% of FHSS's are genuinely radar -- the
  # two classes share a decision boundary and trade against each other:
  # the FHSS pipeline doc records recall rising 82.5 -> 89.7 -> 92.2 across
  # three fixes while JAMMING fell 80.0 -> 73.3 -> 67.5 in the same runs.
  #
  # They differ physically in how they move through frequency. An LFM
  # chirp sweeps linearly and continuously, so its instantaneous frequency
  # changes at a near-constant rate. A frequency hopper HOLDS a channel
  # then JUMPS, so its instantaneous frequency sits still and then spikes.
  # The second derivative of unwrapped phase captures exactly that
  # difference: measured on the held-out test split, standalone windows,
  # as the ratio max|d2phase| / median|d2phase| -- radar 4.20 +/- 0.35 vs
  # FHSS 5.27 +/- 0.50 at +2dB, AUC 0.971 at +2dB rising toward 0.964 at
  # +10dB and collapsing to ~0.6 below -6dB where the phase derivative is
  # noise-dominated. Pooled across all SNR the AUC is 0.887 -- see
  # src/models/amc_cnn.py's IFFeatures docstring for the full per-SNR
  # table and a caution about a sibling candidate feature ("fraction of
  # samples below the median") that measured a perfect but bogus AUC of
  # 1.000 and was discarded as a tie-breaking artifact.
  #
  # When true: AMC_CNN's IFFeatures branch (src/models/amc_cnn.py) unwraps
  # the phase of the raw complex IQ window, takes its second difference,
  # and concatenates the single scalar ratio of that difference's max
  # absolute value to its median absolute value onto the fused feature
  # vector before fc1 -- fc1.in_features grows by exactly 1. Composes with
  # `cumulant_features` above: either, both, or neither may be on.
  #
  # Default false because the five checkpoints in results/ were trained
  # against the flag-off architecture (fc1 sized without this extra input)
  # and must keep loading with strict=True; this is an experimental option
  # to be evaluated (retrain + measure_variance.py) before ever being
  # turned on for a submission.
  if_features: false

training:
  epochs: 30
  batch_size: 64
  learning_rate: 0.001
  scheduler_patience: 3

paths:
  raw_data: data/raw
  processed_data: data/processed
  checkpoints: results
  evals: evals
